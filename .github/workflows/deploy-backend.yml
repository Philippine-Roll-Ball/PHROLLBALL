name: Deploy ASP.NET Core Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'server/**' # Only trigger if changes are made to the server folder

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Match your project version

      - name: Restore dependencies
        run: dotnet restore server/Server.csproj # Adjust path to your .csproj

      - name: Build
        run: dotnet build server/Server.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish server/Server.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ASP-PRBF-856e' # Replace with your actual app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
